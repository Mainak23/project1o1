apiVersion: apps/v1
kind: Deployment

metadata:
  name: ml-serving2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ml-serving2

  template:
    metadata:
      labels:
        app: ml-serving2

    
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: ml-serving2
          image: ghcr.io/mainak23/ml-serving:59

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          env:
            - name: MLFLOW_TRACKING_URI
              value: "http://192.168.0.107:5000"

            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://192.168.0.107:9000"

            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"

            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin123"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10