containers:
  - name: ml-serving2
    image: ml-serving:1

    ports:
      - containerPort: 8080

    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"  #"Reserve approximately 512 MiB of memory for this container."
      limits:
        cpu: "1"
        memory: "1Gi"

    env:
      - name: MLFLOW_TRACKING_URI
        value: "http://mlflow:5000"

      - name: MLFLOW_S3_ENDPOINT_URL
        value: "http://minio:9000"

      - name: AWS_ACCESS_KEY_ID
        value: "minioadmin"

      - name: AWS_SECRET_ACCESS_KEY
        value: "minioadmin123"

    readinessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5

    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
